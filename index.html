<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>embedding-plot-web · 向量 2D 可视化</title>
<style>
  :root { --bg:#0f1419; --panel:#1a2029; --fg:#e6e8eb; --muted:#8a93a0; --accent:#5b8def; --line:#2a313c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"PingFang SC",Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:14px; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .sub { color:var(--muted); font-size:12px; }
  main { display:grid; grid-template-columns:340px 1fr; gap:14px; padding:14px; height:calc(100vh - 54px); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; overflow:auto; }
  textarea { width:100%; min-height:140px; background:#0d1117; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:8px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:7px 12px; cursor:pointer; font-size:13px; }
  button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); }
  .row { display:flex; gap:8px; margin:8px 0; flex-wrap:wrap; }
  label { font-size:12px; color:var(--muted); display:block; margin:6px 0 3px; }
  #plot { width:100%; height:100%; background:#0d1117; border-radius:6px; border:1px solid var(--line); }
  #tooltip { position:fixed; pointer-events:none; background:#000d; border:1px solid var(--line); padding:6px 9px; border-radius:6px; font-size:12px; display:none; z-index:10; max-width:280px; }
  .legend { display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; font-size:12px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; vertical-align:middle; }
  .stats { font-size:12px; color:var(--muted); margin-top:6px; }
</style>
</head>
<body>
<header>
  <h1>embedding-plot-web</h1>
  <span class="sub">粘贴向量点 / 文本经哈希向量化 → Canvas 散点 + 聚类着色 + 悬停详情</span>
</header>
<main>
  <div class="panel">
    <label>数据（每行一个点：label, x, y 或 仅文本）</label>
    <textarea id="data">苹果 1.2 0.5
香蕉 -0.8 0.3
汽车 0.2 1.1
飞机 -1.1 -0.6
猫咪 0.9 -0.9
小狗 -0.4 -1.2</textarea>
    <div class="row">
      <button id="btnPlot">绘制散点</button>
      <button id="btnCluster">聚类着色</button>
    </div>
    <label>聚类数 k</label>
    <input id="k" type="number" value="3" min="1" max="8" style="width:80px;background:#0d1117;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px"/>
    <div class="legend" id="legend"></div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="panel" style="display:flex;flex-direction:column"><canvas id="plot"></canvas></div>
</main>
<div id="tooltip"></div>
<script>
function hashTextToVec(text) {
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  for (let i = 0; i < text.length; i++) {
    const c = text.charCodeAt(i);
    h1 = ((h1 ^ c) * 0x01000193) >>> 0;
    h2 = ((h2 ^ (c * 7)) * 0x85ebca6b) >>> 0;
  }
  return [+((h1 / 0xffffffff) * 2 - 1).toFixed(4), +((h2 / 0xffffffff) * 2 - 1).toFixed(4)];
}
function parseInput(text) {
  const points = [];
  for (const raw of text.split(/\n/)) {
    const line = raw.trim();
    if (!line) continue;
    const parts = line.split(/[\s,，]+/).filter(Boolean);
    if (parts.length >= 3 && !isNaN(+parts[1]) && !isNaN(+parts[2])) {
      points.push({ label: parts[0], x: +parts[1], y: +parts[2] });
    } else {
      const [hx, hy] = hashTextToVec(line);
      points.push({ label: line, x: hx, y: hy, hashed: true });
    }
  }
  return points;
}
function euclid(a, b) { return Math.sqrt((a[0]-b[0])**2 + (a[1]-b[1])**2); }
function kmeans(points, k, iters = 20) {
  if (!points.length) return [];
  const centroids = [];
  const step = Math.max(1, Math.floor(points.length / k));
  for (let i = 0; i < k && i * step < points.length; i++) centroids.push([points[i*step].x, points[i*step].y]);
  let labels = new Array(points.length).fill(0);
  for (let it = 0; it < iters; it++) {
    let changed = false;
    points.forEach((p, i) => {
      let best = 0, bd = Infinity;
      centroids.forEach((c, ci) => { const d = euclid([p.x,p.y], c); if (d < bd) { bd = d; best = ci; } });
      if (labels[i] !== best) { labels[i] = best; changed = true; }
    });
    for (let ci = 0; ci < centroids.length; ci++) {
      const members = points.filter((_, i) => labels[i] === ci);
      if (!members.length) continue;
      centroids[ci] = [members.reduce((s,p)=>s+p.x,0)/members.length, members.reduce((s,p)=>s+p.y,0)/members.length];
    }
    if (!changed) break;
  }
  return labels;
}
if (typeof module !== "undefined" && module.exports) module.exports = { hashTextToVec, parseInput, euclid, kmeans };
if (typeof document !== "undefined") {
const COLORS = ["#5b8def","#ef6b8a","#6bd9a0","#e0b34a","#a78bfa","#4dd0e1"];
let currentPoints = [], currentLabels = [];
function draw(points, labels) {
  const canvas = document.getElementById("plot");
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width*dpr; canvas.height = rect.height*dpr;
  canvas.style.width = rect.width+"px"; canvas.style.height = rect.height+"px";
  const ctx = canvas.getContext("2d"); ctx.scale(dpr,dpr); ctx.clearRect(0,0,rect.width,rect.height);
  const xs=points.map(p=>p.x), ys=points.map(p=>p.y);
  const minX=Math.min(...xs,-1), maxX=Math.max(...xs,1), minY=Math.min(...ys,-1), maxY=Math.max(...ys,1);
  const pad=40;
  const sx=v=>pad+(v-minX)/(maxX-minX||1)*(rect.width-pad*2);
  const sy=v=>rect.height-pad-(v-minY)/(maxY-minY||1)*(rect.height-pad*2);
  points.forEach((p,i)=>{
    const c = labels.length ? COLORS[labels[i]%COLORS.length] : "#5b8def";
    ctx.beginPath(); ctx.arc(sx(p.x),sy(p.y),7,0,Math.PI*2); ctx.fillStyle=c; ctx.fill(); ctx.strokeStyle="#0d1117"; ctx.stroke();
    ctx.fillStyle="#c9d1d9"; ctx.font="11px sans-serif"; ctx.fillText(p.label, sx(p.x)+10, sy(p.y)+4);
  });
  const legend = document.getElementById("legend"); legend.innerHTML="";
  if (labels.length) new Set(labels).forEach(ci=>{ const s=document.createElement("span"); s.innerHTML=`<span class="dot" style="background:${COLORS[ci%COLORS.length]}"></span>簇 ${ci+1}`; legend.appendChild(s); });
  document.getElementById("stats").textContent = `共 ${points.length} 个点`;
  const tip=document.getElementById("tooltip");
  canvas.onmousemove=(ev)=>{ const r=canvas.getBoundingClientRect(); const mx=ev.clientX-r.left,my=ev.clientY-r.top; let hit=null; points.forEach((p,i)=>{ const dx=mx-sx(p.x),dy=my-sy(p.y); if(dx*dx+dy*dy<100) hit={p,i}; });
    if(hit){ tip.style.display="block"; tip.style.left=(ev.clientX+12)+"px"; tip.style.top=(ev.clientY+12)+"px"; tip.innerHTML=`<b>${hit.p.label}</b><br/>x=${hit.p.x.toFixed(3)} y=${hit.p.y.toFixed(3)}`+(labels.length?`<br/>簇 ${labels[hit.i]+1}`:""); }
    else tip.style.display="none"; };
}
document.getElementById("btnPlot").onclick=()=>{ currentPoints=parseInput(document.getElementById("data").value); currentLabels=[]; draw(currentPoints,currentLabels); };
document.getElementById("btnCluster").onclick=()=>{ if(!currentPoints.length) currentPoints=parseInput(document.getElementById("data").value); const k=Math.max(1,+document.getElementById("k").value||3); currentLabels=kmeans(currentPoints,k); draw(currentPoints,currentLabels); };
currentPoints=parseInput(document.getElementById("data").value); draw(currentPoints,currentLabels);
window.addEventListener("resize", ()=>draw(currentPoints,currentLabels));
}
</script>
</body>
</html>
